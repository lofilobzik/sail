# Check ghcr.io for a new image every 5 minutes instead of the default once a day, so a push to main
# is live within a few minutes of CI finishing. Installed to
# /etc/systemd/system/podman-auto-update.timer.d/ by install.sh.
[Timer]
OnCalendar=
OnCalendar=*:0/5
RandomizedDelaySec=
RandomizedDelaySec=30s
